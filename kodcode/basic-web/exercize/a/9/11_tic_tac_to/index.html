<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tic Tac Toe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container" id="main">
      <span id="turn">Tic Tac Toe</span>

      <div class="box" style="border-left: 0; border-top: 0"></div>
      <div class="box" style="border-top: 0"></div>
      <div class="box" style="border-top: 0; border-right: 0"></div>
      <div class="box" style="border-left: 0"></div>
      <div class="box"></div>
      <div class="box" style="border-right: 0"></div>
      <div class="box" style="border-left: 0; border-bottom: 0"></div>
      <div class="box" style="border-bottom: 0"></div>
      <div class="box" style="border-right: 0; border-bottom: 0"></div>
    </div>

    <button class="btn btn-rounded" id="replay">Play</button>
    <script src="script.js"></script>
  </body>
</html>
