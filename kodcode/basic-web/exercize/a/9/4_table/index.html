<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="container-fluid my-3">
        <table class="table table-striped table-dark">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Name</th>
              <th scope="col">Age</th>
              <th scope="col">Sex</th>
            </tr>
          </thead>
          <tbody id="table">
            
          </tbody>
        </table>
        <div class="input-group-lg col-7 mx-auto">
          <input type="text" class="input-group-text my-2" id="name_inp" placeholder="Name" />
          <input type="number" class="input-group-text my-2" id="age_inp" placeholder="Age"/>
          <input type="text" class="input-group-text my-2" id="sex_inp" placeholder="Sex"/>
        </div>
        <div class="buttons d-flex flex-column mt-3">
            <button class="btn btn-primary" id="add_btn">Add</button>
            <input type="number" id="remove_id" class="input-group my-2" placeholder="ID to remove" >
            <button class="btn btn-danger mt-2" id="del_btn">Delete</button>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
