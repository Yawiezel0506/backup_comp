<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h1 class="display-4 text-center">User details:</h1>
      <form>
        <label>
          Name:
          <input type="text" id="nameInput" max="50" required/>
        </label>
        <br /><br />
        <label>
          Email Address:
          <input type="email" id="emailAddressInput" required/>
        </label>
        <br /><br />
        <label>
          Password:
          <input type="password" id="passwordInput" minlength=8 required/>
        </label>
        <br /><br />
        <label>
          sex: 
          Male: <input type="radio" name="sexChoose" value="male" checked/> 
          Female: <input type="radio" name="sexChoose" />
        </label>
        <br /><br />
        <label>
          country:
          <select name="countrys" id="countrys">
            <option value="USA">United State</option>
            <option value="UK">United Kingdom</option>
            <option value="Canada">Canada</option>
            <option value="Australia">Australia</option>
          </select>
        </label>
        <br /><br />
        <label> age:<input type="number" min="18" max="120" required /> </label>
        <br /><br />
        <label> Address: <input type="text" id="addressInput" /> </label>
        <br /><br />
        <label> Phone: <input type="tel" id="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required/> </label>
        <br /><br />
        <label>
          Date of Birth (yyyy/mm/dd):<input type="date" id="dateOfBirth" />
        </label>
        <br><br>
        <label>
            color:
            <input type="color" id="favColor"/>
        </label>
        <br><br>
        <label>
            I am agree for the thems of use:
            <input type='checkbox' checked/>
        </label>
        <br><br>
        <button>Send</button>
      </form>
    </div>
  </body>
</html>
